name: Sync AR BookFinder data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      sync_limit:
        description: "Maximum exact book identities (1–25)"
        required: false
        default: "25"
      debug:
        description: "Save redacted field-availability diagnostics (1 = on)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ar-book-identity-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run conservative identity sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_LIMIT: ${{ github.event.inputs.sync_limit || '25' }}
          SYNC_DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: npm run sync
      - name: Upload requested diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
